name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: alfa
          POSTGRES_PASSWORD: alfa_local_only
          POSTGRES_DB: alfa
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U alfa -d alfa" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
        env:
          RUN_INTEGRATION: 'true'
          TEST_DATABASE_URL: postgresql://alfa:alfa_local_only@127.0.0.1:5432/alfa
      - run: pnpm build > /tmp/build.log 2>&1 || { tail -n 60 /tmp/build.log; exit 1; }
      - run: pnpm --filter @alfa/frontend exec playwright install --with-deps chromium
      - name: Browser + API + worker
        env:
          DATABASE_URL: postgresql://alfa:alfa_local_only@127.0.0.1:5432/alfa
          DEV_AUTH: 'true'
          TEST_BACKEND: 'true'
        run: |
          pnpm db:migrate
          pnpm --filter @alfa/backend start > /tmp/api.log 2>&1 &
          pnpm --filter @alfa/backend worker:start > /tmp/worker.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/ready; then break; fi
            sleep 1
          done
          pnpm --filter @alfa/frontend test:e2e
