services:
  frontend:
    profiles: [apps]
    build: .
    command: [pnpm, --filter, '@alfa/frontend', dev]
    environment:
      API_PROXY_TARGET: http://backend:3001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  backend:
    profiles: [apps]
    build: .
    command: [pnpm, --filter, '@alfa/backend', dev]
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://alfa:alfa_local_only@postgres:5432/alfa
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: alfa_local_only
      POSTGRES_DB: alfa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
